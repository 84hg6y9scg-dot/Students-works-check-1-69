<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสแกนส่งงาน</title>
    <!-- โหลดไลบรารีสแกน QR Code -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            margin: 0; padding: 20px; font-family: sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px;
            width: 100%; max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
        }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 16px; border: 2px solid #ddd; background: #000; }
        .status { padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; background: #f0f0f0; transition: 0.3s; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="glass-card">
    <h2>ระบบบันทึกการส่งงาน</h2>
    <div id="reader"></div>
    <div id="status" class="status">กำลังเปิดกล้องหลัง...</div>
</div>

<script>
    // ==========================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwlisdnrMKP3HckaQrUPnTqWpLtEqn3qDU4YFTkQKUzkJ6NoB0uV4e9sJ37GnJW33_BRw/exec"; 
    // ==========================================

    let isScanning = false;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    // --- ฟังก์ชันสร้างเสียง 3 รูปแบบ ---
    
    // 1. เสียงสแกนติด (Beep สั้นๆ แหลมๆ)
    function playScanBeep() {
        playTone(880, 0.1, 'sine');
    }

    // 2. เสียงสำเร็จ (เสียงสูง 2 จังหวะ ติ๊ด-ติ้ว)
    function playSuccessSound() {
        playTone(880, 0.1, 'sine');
        setTimeout(() => playTone(1320, 0.15, 'sine'), 100);
    }

    // 3. เสียงแจ้งเตือน/ส่งซ้ำ (เสียงต่ำ ลากยาว ตื๊ด...)
    function playErrorSound() {
        playTone(220, 0.4, 'sawtooth'); // sawtooth จะให้เสียงที่ดูดุขึ้น
    }

    function playTone(freq, duration, type) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = type;
        oscillator.frequency.value = freq;
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
    }

    function onScanSuccess(decodedText, decodedResult) {
        if (isScanning) return; 
        if (audioCtx.state === 'suspended') audioCtx.resume(); // ปลุกระบบเสียง

        const parts = decodedText.split('_');
        
        if(parts.length === 4) {
            isScanning = true;
            playScanBeep(); // 🔈 เสียงสแกนติดครั้งแรก

            const subject = parts[0];
            const classRoom = parts[1];
            const studentId = parts[2];
            const workId = parts[3];
            const timestamp = new Date().toLocaleString('th-TH');

            const statusDiv = document.getElementById('status');
            statusDiv.innerText = `⏳ กำลังบันทึก: ชั้น ${classRoom} เลขที่ ${studentId}...`;
            statusDiv.className = 'status';

            const formData = new URLSearchParams();
            formData.append('subject', subject);
            formData.append('classRoom', classRoom);
            formData.append('studentId', studentId);
            formData.append('workId', workId);
            formData.append('timestamp', timestamp);

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: formData,
            }).then(response => response.text())
              .then(data => {
                  if (data === "Success") {
                      playSuccessSound(); // 🔈 เสียงเชิงบวก (สำเร็จ)
                      statusDiv.innerText = `✅ ชั้น ${classRoom} เลขที่ ${studentId} ส่งงานสำเร็จ!`;
                      statusDiv.className = 'status success';
                  } else if (data === "Duplicate Submission") {
                      playErrorSound(); // 🔈 เสียงเชิงลบ (ส่งซ้ำ)
                      statusDiv.innerText = `⚠️ งานชิ้นนี้ส่งไปแล้วครับ!`;
                      statusDiv.className = 'status error';
                  } else {
                      playErrorSound();
                      statusDiv.innerText = `❌ ระบบตอบกลับ: ${data}`;
                  }
                  
                  setTimeout(() => {
                      statusDiv.innerText = 'รอการสแกน...';
                      statusDiv.className = 'status';
                      isScanning = false;
                  }, 3000);
              }).catch(error => {
                  playErrorSound(); // 🔈 เสียงเชิงลบ (Error)
                  statusDiv.innerText = `❌ เกิดข้อผิดพลาดในการเชื่อมต่อ`;
                  statusDiv.className = 'status error';
                  isScanning = false;
              });
        } else {
            playErrorSound();
            document.getElementById('status').innerText = '❌ รูปแบบ QR Code ไม่ถูกต้อง';
            document.getElementById('status').className = 'status error';
        }
    }

    // เริ่มกล้อง
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        () => {}
    ).then(() => {
        document.getElementById('status').innerText = 'รอการสแกน...';
    }).catch((err) => {
        document.getElementById('status').innerText = '❌ ไม่สามารถเข้าถึงกล้องได้';
        document.getElementById('status').className = 'status error';
    });
</script>

</body>
</html>
