<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสแกนส่งงาน</title>
    <!-- โหลดไลบรารีสแกน QR Code -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            margin: 0; padding: 20px; font-family: sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px;
            width: 100%; max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
        }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 16px; border: 2px solid #ddd; background: #000; }
        .status { padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; background: #f0f0f0; transition: 0.3s; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="glass-card">
    <h2>ระบบบันทึกการส่งงาน</h2>
    <div id="reader"></div>
    <div id="status" class="status">กำลังเปิดกล้องหลัง...</div>
</div>

<script>
    // ==========================================
    // อย่าลืมนำ URL ของ Web App จาก Google มาวางที่นี่
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxUKc860WpGq5EjDDX02xV3-euJnpwNY8VZgBsdzNz7MSjQRTOK7eRdM7-D0IIzJ15LWg/exec"; 
    // ==========================================

    let isScanning = false;

    // ฟังก์ชันสร้างเสียง Beep 
    function playBeep() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sine'; // เสียงแบบคลื่นไซน์ (ใสๆ)
            oscillator.frequency.value = 880; // ความถี่เสียง
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); // ความดัง
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.15); // เล่นเสียง 0.15 วินาที
        } catch (e) {
            console.error("เบราว์เซอร์ไม่รองรับระบบเสียง");
        }
    }

    function onScanSuccess(decodedText, decodedResult) {
        if (isScanning) return; 
        
        // แยกข้อมูลด้วย _ (คาดหวังรูปแบบ: วิชา_ชั้นเรียน_เลขที่_งานที่)
        const parts = decodedText.split('_');
        
        if(parts.length === 4) {
            isScanning = true;
            
            // เล่นเสียง Beep เมื่อสแกนข้อมูลถูกต้อง
            playBeep();

            const subject = parts[0];
            const classRoom = parts[1];
            const studentId = parts[2];
            const workId = parts[3];
            const timestamp = new Date().toLocaleString('th-TH');

            const statusDiv = document.getElementById('status');
            statusDiv.innerText = `⏳ กำลังบันทึก: ชั้น ${classRoom} เลขที่ ${studentId}...`;
            statusDiv.className = 'status';

            const formData = new URLSearchParams();
            formData.append('subject', subject);
            formData.append('classRoom', classRoom);
            formData.append('studentId', studentId);
            formData.append('workId', workId);
            formData.append('timestamp', timestamp);

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: formData,
            }).then(response => response.text())
              .then(data => {
                  statusDiv.innerText = `✅ ชั้น ${classRoom} เลขที่ ${studentId} ส่งงานสำเร็จ!`;
                  statusDiv.className = 'status success';
                  
                  setTimeout(() => {
                      statusDiv.innerText = 'รอการสแกน...';
                      statusDiv.className = 'status';
                      isScanning = false;
                  }, 3000);
              }).catch(error => {
                  statusDiv.innerText = `❌ เกิดข้อผิดพลาดในการบันทึก`;
                  statusDiv.className = 'status error';
                  isScanning = false;
              });
        } else {
            // เล่นเสียงต่ำเพื่อเตือนว่าสแกนผิด (ทางเลือกเสริม)
            document.getElementById('status').innerText = '❌ รูปแบบ QR Code ไม่ถูกต้อง';
            document.getElementById('status').className = 'status error';
        }
    }

    // ใช้คลาส Html5Qrcode แบบตรงๆ เพื่อข้าม UI และบังคับเปิดกล้องหลัง
    const html5QrCode = new Html5Qrcode("reader");
    
    html5QrCode.start(
        { facingMode: "environment" }, // บังคับใช้กล้องหลัง
        {
            fps: 10,
            qrbox: { width: 250, height: 250 }
        },
        onScanSuccess,
        (errorMessage) => {
            // ไม่ต้องแสดงข้อความ Error ระหว่างที่กล้องกำลังหา QR Code
        }
    ).then(() => {
        document.getElementById('status').innerText = 'รอการสแกน...';
    }).catch((err) => {
        document.getElementById('status').innerText = '❌ ไม่สามารถเข้าถึงกล้องได้ กรุณาตรวจสอบการอนุญาต';
        document.getElementById('status').className = 'status error';
    });
</script>

</body>
</html>
