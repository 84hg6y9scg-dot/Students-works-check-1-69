<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Diagnostic Mode</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #2c3e50; color: white; text-align: center; }
        .card { background: white; color: #333; border-radius: 20px; padding: 20px; max-width: 400px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        #reader { width: 100%; border-radius: 10px; background: #000; margin-bottom: 15px; }
        .status-box { padding: 15px; border-radius: 10px; font-weight: bold; font-size: 14px; margin-top: 10px; min-height: 50px; border: 1px solid #ddd; }
        .err-detail { font-family: monospace; font-size: 11px; color: #721c24; margin-top: 5px; display: block; }
    </style>
</head>
<body>

<div class="card">
    <h3>ระบบสแกน (โหมดตรวจสอบ)</h3>
    <div id="reader"></div>
    <div id="status" class="status-box">กำลังเตรียมระบบ...</div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwvlPWexcClqhDd37nRzvRCOo_Iv_12LUwA8ENdFCpmfXi8FSXc2eyfOQi5RsFPrsqC/exec";

    let isScanning = false;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playTone(freq, duration, type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = type; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function onScanSuccess(decodedText) {
        if (isScanning) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const parts = decodedText.split('_');
        if(parts.length === 4) {
            isScanning = true;
            playTone(880, 0.1, 'sine');

            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = "⏳ กำลังส่งข้อมูล...";
            statusDiv.style.background = "#fff3cd";

            const formData = new URLSearchParams();
            formData.append('subject', parts[0]);
            formData.append('classRoom', parts[1]);
            formData.append('studentId', parts[2]);
            formData.append('workId', parts[3]);
            formData.append('timestamp', new Date().toLocaleString('th-TH'));

            // เพิ่ม Timeout 10 วินาที
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);

            fetch(WEB_APP_URL, { method: 'POST', body: formData, signal: controller.signal })
            .then(res => {
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                return res.text();
            })
            .then(data => {
                if (data === "Success") {
                    playTone(1320, 0.2, 'sine');
                    statusDiv.innerHTML = "✅ บันทึกสำเร็จ!";
                    statusDiv.style.background = "#d4edda";
                } else {
                    playTone(220, 0.4, 'sawtooth');
                    statusDiv.innerHTML = `⚠️ ปัญหา: ${data}`;
                    statusDiv.style.background = "#f8d7da";
                }
                setTimeout(() => { isScanning = false; statusDiv.innerHTML = "รอการสแกน..."; statusDiv.style.background = "#f0f0f0"; }, 3000);
            })
            .catch(err => {
                clearTimeout(timeoutId);
                playTone(220, 0.5, 'sawtooth');
                let errMsg = (err.name === 'AbortError') ? "เน็ตช้าเกินไป (Timeout)" : "เชื่อมต่อไม่ได้";
                statusDiv.innerHTML = `❌ ${errMsg} <span class="err-detail">${err.message}</span>`;
                statusDiv.style.background = "#f8d7da";
                setTimeout(() => { isScanning = false; }, 4000);
            });
        }
    }

    const scanner = new Html5Qrcode("reader");
    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess).then(() => {
        document.getElementById('status').innerText = "พร้อมสแกน";
    });
</script>
</body>
</html>
